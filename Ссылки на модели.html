<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D-модель с Sketchfab</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }
      .container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 10px;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .model-wrapper {
        width: 100%;
        aspect-ratio: 16 / 9; /* сохраняет пропорции */
        border: 1px solid #ccc;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        background: #000; /* чёрный фон под моделью */
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .info {
        margin-top: 15px;
        padding: 15px;
        background: white;
        border-radius: 6px;
        line-height: 1.5;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>3D‑модели</h1>
      <div class="info">
        <p></p>
      </div>
      <div class="model-wrapper">
        <!-- ВСТАВЬТЕ СЮДА ССЫЛКУ НА МОДЕЛЬ -->
        <iframe
          title="Люковый вагон"
          frameborder="0"
          allowfullscreen
          mozallowfullscreen="true"
          webkitallowfullscreen="true"
          allow="autoplay; fullscreen; xr-spatial-tracking"
          xr-spatial-tracking
          execution-while-out-of-viewport
          execution-while-not-rendered
          web-share
          src="https://sketchfab.com/models/519d73147ced4148929fd0e4c5474ce7/embed"
        >
        </iframe>
      </div>

      <div class="info">
        <p></p>
      </div>
      <div class="model-wrapper">
        <!-- ВСТАВЬТЕ СЮДА ССЫЛКУ НА МОДЕЛЬ -->
        <iframe
          title="Хоппер"
          frameborder="0"
          allowfullscreen
          mozallowfullscreen="true"
          webkitallowfullscreen="true"
          allow="autoplay; fullscreen; xr-spatial-tracking"
          xr-spatial-tracking
          execution-while-out-of-viewport
          execution-while-not-rendered
          web-share
          src="https://sketchfab.com/models/0748f751939e438c8b1e9ad4a1711bdb/embed"
        >
        </iframe>
      </div>
    </div>
  </body>
</html>
